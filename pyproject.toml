[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "salesforce-mcp-auto-auth-chrome"
version = "0.2.0"
description = "Drop-in wrapper for mcp-salesforce-connector that auto-refreshes the Salesforce session from your Chrome browser — no more pasting tokens."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Kugamon", email = "contact@kugamon.com" },
]
keywords = [
    "salesforce",
    "mcp",
    "model-context-protocol",
    "claude",
    "claude-desktop",
    "chrome",
    "authentication",
    "session-cookie",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
requires-python = ">=3.12"
dependencies = [
    # Upper bounds guard against breaking upstream releases auto-installing.
    # The two we couple to most tightly — the connector we wrap and the
    # simple-salesforce whose private _call_salesforce we monkey-patch — are
    # capped at the next major/minor so a breaking bump can't silently land.
    "mcp-salesforce-connector>=0.1.15,<0.2",
    "cryptography>=49,<51",
    "simple-salesforce>=1.12,<2",
]

[project.urls]
Homepage = "https://github.com/kugamon/salesforce-mcp-auto-auth-chrome"
Repository = "https://github.com/kugamon/salesforce-mcp-auto-auth-chrome"
Issues = "https://github.com/kugamon/salesforce-mcp-auto-auth-chrome/issues"

[project.scripts]
salesforce-mcp-auto-auth-chrome = "salesforce_mcp_auto_auth_chrome.__main__:main"
salesforce-mcp-browser-only = "salesforce_mcp_auto_auth_chrome.browser_only:main"

[tool.hatch.build.targets.wheel]
packages = ["src/salesforce_mcp_auto_auth_chrome"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
warn_unused_ignores = true

# Third-party packages we depend on that ship no type information. The connector
# is published under a top-level `src` namespace (see __main__), and we patch
# simple_salesforce's internals — neither is typed, so don't fail on them.
[[tool.mypy.overrides]]
module = ["simple_salesforce.*", "src.*"]
ignore_missing_imports = true
