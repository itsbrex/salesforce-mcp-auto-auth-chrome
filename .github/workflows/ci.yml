name: CI

# Lint, type-check, and test on every push to main and every pull request.
# The package is macOS-only at runtime, but the tests mock all OS/browser
# access (temp SQLite DBs, fake binarycookies, monkeypatched platform), so
# they run on ubuntu for speed.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Sync dependencies (incl. dev group)
        run: uv sync

      - name: Ruff (lint)
        run: uv run ruff check src/ tests/

      - name: Mypy (type-check)
        run: uv run mypy src/

      - name: Pytest
        run: uv run pytest
